    <script>
    let data=[{"id": "Out_of_date_Version__GSAP_", "name": "Out-of-date Version (GSAP)", "urls": ["https://www.msbpl.in/wp-content/plugins/essential-grid/public/assets/js/jquery.themepunch.tools.min.js"], "risk_factor": "Medium", "cvss_score": 5.3, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:L/A:N", "cvss_classification": ["CWE-1104"], "owasp": "A03:2025 \u2013 Software Supply Chain Failures", "description": "While testing, we found that the web application uses GreenSock Animation Platform (GSAP) version 1.17.0, which is an outdated release. Outdated third-party libraries may contain publicly disclosed security vulnerabilities, functional defects, or compatibility issues that have been addressed in newer versions. Continued use of obsolete dependencies increases the application's attack surface and may expose it to known exploits if vulnerable functionality is present within the deployed version.", "impact": "The use of an outdated GSAP library may expose the application to publicly disclosed vulnerabilities that could be leveraged by attackers depending on how the library is integrated into the application. Although the impact varies based on implementation, outdated components increase the risk of exploitation through known security flaws and reduce the overall security posture of the application. Additionally, running unsupported dependencies may result in compliance issues with secure software development practices.", "remedy": "It is recommended to upgrade GSAP to the latest stable and vendor-supported version after verifying compatibility with the application. Establish a regular dependency management process to monitor third-party libraries for newly disclosed vulnerabilities and apply vendor security updates in a timely manner. Remove unused or obsolete libraries from the application to reduce the attack surface and maintain a secure software supply chain.", "reference_links": ["https://greensock.com/ ", " https://gsap.com/"]}, {"id": "Out_of_date_Version__Bootstrap_", "name": "Out-of-date Version (Bootstrap)", "urls": ["https://www.msbpl.in/wp-content/themes/exo-theme/js/bootstrap.min.js?ver=3.2.0", "https://www.msbpl.in/wp-content/themes/exo-theme/css/bootstrap.min.css?ver=3.2.0"], "risk_factor": "Medium", "cvss_score": 5.3, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:L/A:N", "cvss_classification": ["CWE-1104"], "owasp": "A03:2025 \u2013 Software Supply Chain Failures", "description": "While testing, we found that the web application uses Bootstrap version 3.2.0, which is an outdated release of the popular front-end framework. Older versions of Bootstrap may contain publicly disclosed security vulnerabilities and compatibility issues that have been resolved in subsequent releases. Continued use of outdated client-side libraries increases the application's attack surface and may expose users to known security weaknesses.", "impact": "The use of an outdated Bootstrap version may allow attackers to exploit known vulnerabilities associated with the framework, depending on how it is implemented within the application. Such vulnerabilities may contribute to client-side attacks, including Cross-Site Scripting (XSS), UI manipulation, or other security issues. Additionally, outdated dependencies increase maintenance overhead and may lead to non-compliance with secure software development and software supply chain security best practices.", "remedy": "It is recommended to upgrade Bootstrap to the latest stable and supported version after validating compatibility with the application. Review application components for deprecated features and update them as necessary before deployment. Additionally, implement a dependency management process to continuously monitor third-party libraries for security advisories and promptly apply vendor-released security patches to minimize exposure to known vulnerabilities.", "reference_links": ["https://getbootstrap.com/ "]}, {"id": "Session_Cookie_Not_Marked_as_Secure", "name": "Session Cookie Not Marked as Secure", "urls": ["https://www.msbpl.in/"], "risk_factor": "Medium", "cvss_score": 5.3, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:L/A:N", "cvss_classification": ["CWE-614"], "owasp": "A07:2025 \u2013 Authentication Failures", "description": "While testing, we found that the application's session cookie is issued without the Secure attribute. The Secure attribute instructs web browsers to transmit the cookie only over encrypted HTTPS connections. Without this attribute, the browser may send the session cookie over unencrypted HTTP connections if they are available, increasing the risk of exposure during transmission. Since session cookies typically contain authentication tokens, the absence of the Secure attribute weakens session protection.", "impact": "An attacker capable of intercepting network traffic may capture session cookies transmitted over unencrypted connections, potentially allowing session hijacking and unauthorized access to user accounts. Compromise of a valid session token may enable the attacker to impersonate legitimate users without requiring their credentials. This risk is particularly significant when users access the application from untrusted or public networks.", "remedy": "It is recommended to configure all session cookies with the Secure attribute so they are transmitted only over HTTPS connections. Ensure that the application enforces HTTPS across all pages using HTTP Strict Transport Security (HSTS) and redirects all HTTP requests to HTTPS. Additionally, configure session cookies with the HttpOnly and SameSite attributes where appropriate to provide comprehensive protection against session-related attacks.", "reference_links": ["https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Set-Cookie "]}, {"id": "Session_Cookie_Not_Marked_as_HttpOnly", "name": "Session Cookie Not Marked as HttpOnly", "urls": ["https://www.msbpl.in/"], "risk_factor": "Medium", "cvss_score": 4.3, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N", "cvss_classification": ["CWE-1004"], "owasp": "A07:2025 \u2013 Authentication Failures", "description": "While testing, we found that one or more cookies issued by the application are not configured with the HttpOnly attribute. The HttpOnly flag instructs web browsers to prevent client-side scripts, such as JavaScript, from accessing the cookie. In its absence, cookies remain accessible through the Document Object Model (DOM), increasing the likelihood of exposure if the application is affected by client-side vulnerabilities such as Cross-Site Scripting (XSS). Session or authentication cookies lacking the HttpOnly attribute are particularly susceptible to theft.", "impact": "If an attacker successfully exploits a Cross-Site Scripting (XSS) vulnerability or executes malicious JavaScript within a user's browser, cookies that lack the HttpOnly attribute may be accessed and exfiltrated. Theft of session cookies can enable session hijacking, allowing an attacker to impersonate legitimate users without requiring valid credentials. Depending on the privileges associated with the compromised session, this may result in unauthorized access to sensitive information or execution of privileged actions.", "remedy": "It is recommended to configure all session and authentication cookies with the HttpOnly attribute to prevent access through client-side scripts. In addition, enforce HTTPS across the application and configure cookies with the Secure and SameSite attributes where appropriate to strengthen session security. Regularly review cookie configurations and implement robust input validation and output encoding to minimize the risk of client-side attacks such as Cross-Site Scripting.", "reference_links": ["https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Set-Cookie "]}, {"id": "SameSite_Cookie_Not_Implemented", "name": "SameSite Cookie Not Implemented", "urls": ["https://www.msbpl.in/"], "risk_factor": n Disclosure (Bootstrapjs)", "urls": ["https://www.msbpl.in/"], "risk_factor": "Low", "cvss_score": 3.7, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:R/S:U/C:N/I:L/A:N", "cvss_classification": ["CWE-200"], "owasp": "A02:2025 \u2013 Security Misconfiguration", "description": "While testing, we found that the web application discloses the version of the Bootstrap framework (version 3.2.0) through publicly accessible client-side resources. Version disclosure enables attackers to identify the exact version of the framework in use and determine whether it is affected by publicly disclosed vulnerabilities. Although version disclosure alone does not directly compromise the application, it provides valuable reconnaissance information that may assist attackers in identifying potential attack vectors and exploiting known weaknesses.", "impact": "The disclosure of the Bootstrap version allows attackers to fingerprint the application's technology stack and correlate the identified version with publicly available vulnerabilities, exploits, or security advisories. This information reduces the effort required during reconnaissance and may increase the likelihood of successful attacks if the disclosed version contains known security issues. Additionally, exposing unnecessary implementation details weakens the application's overall security posture.", "remedy": "It is recommended to minimize Bootstrap version disclosure by removing version identifiers from publicly accessible JavaScript and CSS files, comments, banners, and other client-side resources where feasible. Upgrade the Bootstrap framework to the latest supported version after validating compatibility with the application. Additionally, establish a regular dependency management process to monitor third-party libraries for security updates and promptly apply vendor-released patches to reduce exposure to known vulnerabilities.", "reference_links": ["https://www.drupal.org/project/drupal/issues/3518344 "]}, {"id": "Version_Discl leased patches.", "reference_links": ["https://www.drupal.org/project/drupal/issues/3518344 "]}, {"id": "WordPress_Plugin_Contact_Form_7_Version_Disclosure", "name": "WordPress Plugin Contact Form 7 Version Disclosure", "urls": ["https://www.msbpl.in/wp-content/plugins/contact-form-7/readme.txt"], "risk_factor": "Low", "cvss_score": 3.7, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:R/S:U/C:N/I:L/A:N", "cvss_classification": ["CWE-200"], "owasp": "A02:2025 \u2013 Security Misconfiguration", "description": "While testing, we found that the web application discloses the version of the WordPress Contact Form 7 plugin through publicly accessible resources, such as plugin files, metadata, or source code. Version disclosure enables attackers to identify the exact plugin version in use and correlate it with publicly disclosed vulnerabilities, security advisories, or exploit databases. Although this issue does not directly compromise the application, it provides valuable reconnaissance information that may facilitate targeted attacks against the plugin if vulnerable versions are deployed.", "impact": "The disclosure of the Contact Form 7 plugin version allows attackers to fingerprint the application's WordPress installation and identify whether the deployed plugin version is affected by known security vulnerabilities. This information significantly reduces the effort required during reconnaissance and may increase the likelihood of successful exploitation if the plugin is outdated or unpatched. Additionally, exposing unnecessary implementation details weakens the application's overall security posture and aids attackers in planning targeted attacks.", "remedy": "It is recommended to minimize Contact Form 7 version disclosure by removing or restricting access to publicly accessible plugin metadata where feasible. Upgrade the Contact Form 7 plugin to the latest stable and vendor-supported version after verifying compatibility with the WordPress installation. Additionally, implement a regular plugin management process to monitor WordPress plugins for newly disclosed vulnerabilities, promptly apply vendor-released security updates, and remove unused or unnecessary plugins to reduce the application's attack surface.", "reference_links": ["https://wordpress.org/plugins/contact-form-7/ "]}, {"id": "Missing_X_frame_Options__Header", "name": "Missing X-frame-Options  Header", "urls": ["https://www.msbpl.in/"], "risk_factor": "Low", "cvss_score": 3.7, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:R/S:U/C:N/I:L/A:N", "cvss_classification": ["CWE-1021"], "owasp": "A02:2025 \u2013 Security Misconfiguration", "description": "While testing, we found that the web application does not include the X-Frame-Options HTTP response header in its responses. This header instructs web browsers whether a page is permitted to be displayed within a frame, iframe, embed, or object on another website. In the absence of this protection, the application may be embedded within a malicious webpage, increasing the risk of clickjacking attacks.", "impact": "An attacker may exploit the absence of the X-Frame-Options header by embedding the application inside a transparent or disguised iframe on a malicious website. Users may unknowingly interact with the framed application, allowing attackers to trick them into performing unintended actions such as modifying account settings, approving transactions, or executing privileged operations using their authenticated session. This can lead to unauthorized actions and compromise the integrity of user interactions.", "remedy": "It is recommended to configure the web server or application to include the X-Frame-Options response header with the value DENY or SAMEORIGIN, depending on the application's functional requirements. Additionally, implement the Content-Security-Policy (CSP) frame-ancestors directive, which provides more granular control over which origins are permitted to embed the application. Regularly review HTTP security headers to ensure browser-side protections are consistently applied across all application pages.", "reference_links": ["https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/X-Frame-Options "]}, {"id": "HTTP_Strict_Transport_Security__HSTS__Policy_Not_Enabled", "name": "HTTP Strict Transport Security (HSTS) Policy Not Enabled", "urls": ["https://www.msbpl.in/"], "risk_factor": "Low", "cvss_score": 3.7, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:R/S:U/C:N/I:L/A:N", "cvss_classification": ["CWE-319"], "owasp": "A02:2025 \u2013 Security Misconfiguration", "description": "The application does not implement the HTTP Strict Transport Security (HSTS) security header. HSTS is a web security mechanism that instructs browsers to enforce HTTPS connections and prevent any attempt to downgrade communication to HTTP. Analysis of the server response headers confirms that the Strict-Transport-Security header is not present and the browser explicitly reports HSTS as disabled. As a result, browsers are not instructed to enforce secure transport for subsequent connections.", "impact": "In the absence of HSTS enforcement, an attacker positioned on the network can attempt protocol downgrade attacks such as SSL stripping, particularly during a user\u2019s initial connection to the application. This may allow interception or manipulation of sensitive traffic including authentication tokens, session cookies, and API requests. Although HTTPS is enabled, the lack of HSTS weakens transport-layer protections and increases the risk of man-in-the-middle attacks, especially when users access the application over untrusted networks.", "remedy": "It is recommended to enable HTTP Strict Transport Security by configuring the web server to include the Strict-Transport-Security response header on all HTTPS responses. A secure configuration should specify a long max-age directive and include subdomains. Before enabling HSTS, ensure that HTTPS is fully enforced across the application and all subdomains, as browsers will cache this policy and refuse unsecured connections for the defined duration.A recommended configuration is: Strict-Transport-Security: max-age=31536000; includeSubDomains; preload", "reference_links": ["https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Strict-Transport-Security "]}, {"id": "Content_Security_Policy__CSP__Not_Implemented", "name": "Content Security Policy (CSP) Not Implemented", "urls": ["https://www.msbpl.in/"], "risk_factor": "Low", "cvss_score": 3.7, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:L/I:N/A:N", "cvss_classification": ["CWE-693"], "owasp": "A02:2025 \u2013 Security Misconfiguration", "description": "The application does not implement a Content Security Policy (CSP) response header. CSP is a defense-in-depth security mechanism designed to restrict the sources from which scripts, styles, images, and other resources can be loaded by a web application. Analysis of the HTTP response headers confirms that no Content-Security-Policy header is present, indicating that the browser is not instructed to enforce restrictions on content execution or resource loading.", "impact": "In the absence of a Content Security Policy, the application is more susceptible to client-side attacks such as cross-site scripting (XSS), malicious script injection, and data exfiltration through unauthorized external resources. If an attacker is able to inject malicious JavaScript through another vulnerability or user-controlled input, the lack of CSP allows the script to execute without restriction. This increases the potential impact of client-side vulnerabilities and weakens the overall security posture of the application.", "remedy": "It is recommended to implement a strict Content Security Policy to restrict the execution of untrusted scripts and the loading of external resources. A baseline CSP should define trusted script, style, image, and connection sources and disallow inline script execution wherever possible. CSP should t-Security-Policy, X-Frame-Options, Referrer-Policy should be implemented to provide layered client-side security protection. Regular security configuration reviews should be conducted to ensure compliance with best practices.", "reference_links": ["https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-Content-Type-Options "]}]
